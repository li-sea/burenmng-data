<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>不认命 🔮</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-title" content="不认命">
    <meta name="theme-color" content="#F2F2F7">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #007AFF;
            --bg: #F2F2F7;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text: #1C1C1E;
            --text-secondary: #8E8E93;
            --border: #E5E5EA;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 44px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .navbar-title {
            font-size: 17px;
            font-weight: 600;
        }
        .container {
            padding: 52px 12px 60px;
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .card-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .switch {
            display: flex;
            background: #E5E5EA;
            border-radius: 6px;
            padding: 2px;
            margin: 0 8px 8px;
        }
        .switch-btn {
            flex: 1;
            padding: 6px;
            text-align: center;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
        }
        .switch-btn.active {
            background: white;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }
        .switch-btn:not(.active) {
            color: var(--text-secondary);
        }
        .date-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
        }
        .date-col {
            flex: 1;
            text-align: center;
        }
        .date-col select {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 16px;
            color: var(--primary);
            text-align: center;
            outline: none;
        }
        .date-col label {
            display: block;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }
        .zodiac-display {
            background: white;
            border-radius: 8px;
            padding: 8px 12px;
            margin: 8px 12px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 0.5px solid var(--border);
        }
        .zodiac-label {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .zodiac-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
        }
        .prayer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 8px 12px;
        }
        .prayer-btn {
            padding: 10px 4px;
            background: #F2F2F7;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
        }
        .prayer-btn.active {
            background: var(--primary);
            color: white;
        }
        .prayer-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .prayer-label {
            font-size: 12px;
        }
        .textarea-container {
            padding: 8px 12px;
        }
        .textarea-container textarea {
            width: 100%;
            min-height: 60px;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
        }
        .submit-btn {
            width: calc(100% - 24px);
            padding: 16px;
            background: var(--primary);
            color: white;
            text-align: center;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            border: none;
            margin: 16px 12px 0;
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.3);
        }
        .disclaimer {
            margin-top: 12px;
            padding: 12px;
            text-align: center;
            font-size: 11px;
            color: var(--text-secondary);
        }
        #result-section, .loading {
            display: none;
        }
        .bazi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }
        .bazi-item {
            text-align: center;
            padding: 8px 4px;
            background: white;
            border-radius: 6px;
            border: 0.5px solid var(--border);
        }
        .bazi-label {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .bazi-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
        }
        .wuxing-bar {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }
        .wuxing-label {
            width: 35px;
            font-size: 13px;
        }
        .wuxing-track {
            flex: 1;
            height: 6px;
            background: #E5E5EA;
            border-radius: 3px;
            overflow: hidden;
            margin: 0 8px;
        }
        .wuxing-fill {
            height: 100%;
        }
        .wuxing-count {
            width: 25px;
            text-align: right;
            font-size: 13px;
            font-weight: 600;
        }
        .temple-card {
            background: white;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            border: 0.5px solid var(--border);
        }
        .temple-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .temple-name {
            font-size: 15px;
            font-weight: 600;
        }
        .temple-location {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .tag {
            display: inline-block;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            background: #F2F2F7;
            margin-right: 4px;
        }
        .match-reason {
            font-size: 13px;
            padding: 8px;
            background: #F8F9FA;
            border-radius: 6px;
            margin: 8px 0;
        }
        .retake-btn {
            width: 100%;
            padding: 14px;
            background: var(--text-secondary);
            color: white;
            text-align: center;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            margin-top: 10px;
        }
        .loading-spinner {
            width: 35px;
            height: 35px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="navbar-title">不认命 🔮</div>
    </div>
    
    <div class="container">
        <div id="input-section">
            <div class="card">
                <div class="card-title">出生信息</div>
                
                <div style="padding: 8px 12px; border-bottom: 0.5px solid var(--border);">
                    <input type="text" id="nameInput" placeholder="请输入姓名" style="width: 100%; border: none; outline: none; font-size: 16px; background: transparent; padding: 8px 0;" />
                </div>
                
                <div class="switch">
                    <div class="switch-btn active" onclick="setCalendarType('solar')">阳历</div>
                    <div class="switch-btn" onclick="setCalendarType('lunar')">阴历</div>
                </div>
                
                <div class="switch">
                    <div class="switch-btn active" onclick="setGender('male')">男</div>
                    <div class="switch-btn" onclick="setGender('female')">女</div>
                </div>
                
                <div class="date-row">
                    <div class="date-col">
                        <label>年</label>
                        <select id="yearSelect" onchange="updateZodiac()"></select>
                    </div>
                    <div class="date-col">
                        <label>月</label>
                        <select id="monthSelect" onchange="updateZodiac()"></select>
                    </div>
                    <div class="date-col">
                        <label>日</label>
                        <select id="daySelect" onchange="updateZodiac()"></select>
                    </div>
                    <div class="date-col">
                        <label>时辰</label>
                        <select id="hourSelect" onchange="updateHour(this.value)">
                            <option value="23">子 23-1</option>
                            <option value="1">丑 1-3</option>
                            <option value="3">寅 3-5</option>
                            <option value="5">卯 5-7</option>
                            <option value="7">辰 7-9</option>
                            <option value="9">巳 9-11</option>
                            <option value="11">午 11-13</option>
                            <option value="13" selected>未 13-15</option>
                            <option value="15">申 15-17</option>
                            <option value="17">酉 17-19</option>
                            <option value="19">戌 19-21</option>
                            <option value="21">亥 21-23</option>
                        </select>
                    </div>
                </div>
                
                <div class="zodiac-display">
                    <span class="zodiac-label">生肖</span>
                    <span class="zodiac-value" id="zodiacValue">-</span>
                </div>
            </div>
            
            <div class="card">
                <div class="card-title">想了解什么</div>
                <div class="prayer-grid" id="prayerGrid"></div>
                <div class="textarea-container">
                    <textarea id="recentEvents" placeholder="说说最近遇到的事情...（可选）"></textarea>
                </div>
            </div>
            
            <button class="submit-btn" onclick="calculate()">开始测算</button>
            
            <div class="disclaimer">
                ⚠️ 本应用为传统文化学习工具，内容仅供文化研究和娱乐参考
            </div>
        </div>
        
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">正在为您测算...</div>
        </div>
        
        <div id="result-section">
            <div class="card">
                <div class="card-title">基本信息</div>
                <div id="user-info"></div>
            </div>
            
            <div class="card">
                <div class="card-title">生辰八字</div>
                <div class="bazi-grid" id="bazi-grid"></div>
            </div>
            
            <div class="card">
                <div class="card-title">五行分布</div>
                <div id="wuxing-bars"></div>
            </div>
            
            <div class="card">
                <div class="card-title">建议佩戴</div>
                <div id="faqi-list"></div>
            </div>
            
            <div class="card">
                <div class="card-title">推荐寺庙</div>
                <div id="temple-list"></div>
            </div>
            
            <button class="retake-btn" onclick="retake()">重新测算</button>
        </div>
    </div>
    
    <script>
        let calendarType = 'solar';
        let gender = 'male';
        let selectedHour = 13;
        let selectedPrayer = '全部';
        
        window.onload = function() {
            initDateSelectors();
            initPrayerGrid();
            updateZodiac();
        };
        
        function initDateSelectors() {
            const yearSelect = document.getElementById('yearSelect');
            const monthSelect = document.getElementById('monthSelect');
            const daySelect = document.getElementById('daySelect');
            const currentYear = new Date().getFullYear();
            
            for (let year = 1900; year <= currentYear; year++) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                if (year === 1990) option.selected = true;
                yearSelect.appendChild(option);
            }
            
            for (let month = 1; month <= 12; month++) {
                const option = document.createElement('option');
                option.value = month;
                option.textContent = month;
                if (month === 5) option.selected = true;
                monthSelect.appendChild(option);
            }
            
            for (let day = 1; day <= 31; day++) {
                const option = document.createElement('option');
                option.value = day;
                option.textContent = day;
                if (day === 15) option.selected = true;
                daySelect.appendChild(option);
            }
        }
        
        function initPrayerGrid() {
            const prayers = [
                { icon: '🔮', label: '全部', value: '全部' },
                { icon: '💼', label: '事业', value: '事业' },
                { icon: '💰', label: '财运', value: '财运' },
                { icon: '💕', label: '姻缘', value: '姻缘' },
                { icon: '💪', label: '健康', value: '健康' },
                { icon: '🙏', label: '平安', value: '平安' },
                { icon: '📚', label: '学业', value: '学业' },
                { icon: '🧘', label: '修行', value: '修行' },
                { icon: '✨', label: '其他', value: '其他' }
            ];
            
            const prayerGrid = document.getElementById('prayerGrid');
            prayers.forEach(prayer => {
                const btn = document.createElement('div');
                btn.className = 'prayer-btn' + (prayer.value === '全部' ? ' active' : '');
                btn.onclick = () => selectPrayer(prayer.value, btn);
                btn.innerHTML = `<div class="prayer-icon">${prayer.icon}</div><div class="prayer-label">${prayer.label}</div>`;
                prayerGrid.appendChild(btn);
            });
        }
        
        function setCalendarType(type) {
            calendarType = type;
            const btns = document.querySelectorAll('.switch-btn');
            btns[0].classList.toggle('active', type === 'solar');
            btns[1].classList.toggle('active', type === 'lunar');
        }
        
        function setGender(g) {
            gender = g;
            const btns = document.querySelectorAll('.switch-btn');
            btns[2].classList.toggle('active', g === 'male');
            btns[3].classList.toggle('active', g === 'female');
        }
        
        function updateHour(hour) {
            selectedHour = parseInt(hour);
        }
        
        function selectPrayer(prayer, btn) {
            selectedPrayer = prayer;
            document.querySelectorAll('.prayer-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        
        function updateZodiac() {
            const year = parseInt(document.getElementById('yearSelect').value);
            const zodiacs = ['猴', '鸡', '狗', '猪', '鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊'];
            const zodiacIndex = (year - 1980) % 12;
            const zodiac = zodiacs[zodiacIndex < 0 ? zodiacIndex + 12 : zodiacIndex];
            document.getElementById('zodiacValue').textContent = zodiac;
        }
        
        async function calculate() {
            const name = document.getElementById('nameInput').value.trim();
            const year = parseInt(document.getElementById('yearSelect').value);
            const month = parseInt(document.getElementById('monthSelect').value);
            const day = parseInt(document.getElementById('daySelect').value);
            
            // 验证：姓名和出生年月日必须填写
            if (!name || year === 1990 || month === 5 || day === 15) {
                // 不满足条件，不执行任何操作（静默）
                return;
            }
            
            document.getElementById('input-section').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            
            try {
                const response = await fetch('https://burenmng-data.onrender.com/api/match', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        year: year,
                        month: month,
                        day: day,
                        hour: selectedHour,
                        gender: gender,
                        prayer_focus: selectedPrayer === '全部' ? null : selectedPrayer
                    })
                });
                
                if (!response.ok) throw new Error('API 请求失败');
                
                const result = await response.json();
                showResult(result, { name, year, month, day });
                
            } catch (error) {
                alert('加载失败，请稍后重试');
                retake();
            }
        }
        
        function showResult(result, userData) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('result-section').style.display = 'block';
            
            document.getElementById('user-info').innerHTML = `
                <div style="font-size: 14px; line-height: 1.5;">
                    <div><strong>性别：</strong>${gender === 'male' ? '男' : '女'}</div>
                    <div><strong>出生：</strong>${userData.year}年${userData.month}月${userData.day}日</div>
                    <div><strong>日历：</strong>${calendarType === 'lunar' ? '农历' : '公历'}</div>
                    ${selectedPrayer !== '全部' ? `<div><strong>祈福：</strong>${selectedPrayer}</div>` : ''}
                </div>
            `;
            
            if (result.bazi) {
                const pillars = [
                    { label: '年柱', value: result.bazi['年柱'] || '--' },
                    { label: '月柱', value: result.bazi['月柱'] || '--' },
                    { label: '日柱', value: result.bazi['日柱'] || '--' },
                    { label: '时柱', value: result.bazi['时柱'] || '--' }
                ];
                
                document.getElementById('bazi-grid').innerHTML = pillars.map(p => `
                    <div class="bazi-item">
                        <div class="bazi-label">${p.label}</div>
                        <div class="bazi-value">${p.value}</div>
                    </div>
                `).join('');
            }
            
            if (result.wuxing) {
                const colors = { '金': '#FFD700', '木': '#22C55E', '水': '#3B82F6', '火': '#EF4444', '土': '#A87B51' };
                const items = [
                    { name: '金', count: result.wuxing['金'] || 0 },
                    { name: '木', count: result.wuxing['木'] || 0 },
                    { name: '水', count: result.wuxing['水'] || 0 },
                    { name: '火', count: result.wuxing['火'] || 0 },
                    { name: '土', count: result.wuxing['土'] || 0 }
                ];
                
                const maxCount = Math.max(...items.map(i => i.count), 1);
                
                document.getElementById('wuxing-bars').innerHTML = items.map(item => `
                    <div class="wuxing-bar">
                        <div class="wuxing-label">${item.name}</div>
                        <div class="wuxing-track">
                            <div class="wuxing-fill" style="width: ${(item.count / maxCount) * 100}%; background: ${colors[item.name]}"></div>
                        </div>
                        <div class="wuxing-count">${item.count}</div>
                    </div>
                `).join('');
            }
            
            if (result.faqi && result.faqi.length > 0) {
                document.getElementById('faqi-list').innerHTML = result.faqi.slice(0, 2).map(f => `
                    <div style="background: white; border-radius: 8px; padding: 10px; margin-bottom: 8px;">
                        <div style="font-size: 14px; font-weight: 600; margin-bottom: 6px;">${f.name}</div>
                        <div style="font-size: 12px; color: var(--text-secondary);">${f.description || f.reason || ''}</div>
                    </div>
                `).join('');
            }
            
            if (result.temples && result.temples.length > 0) {
                document.getElementById('temple-list').innerHTML = result.temples.map((t, i) => `
                    <div class="temple-card">
                        <div class="temple-header">
                            <div>
                                <div class="temple-name">${i + 1}. ${t.name}</div>
                                <div class="temple-location">📍 ${t.province || ''}${t.city || ''}</div>
                            </div>
                            <div>${'⭐'.repeat(Math.round(t.rating || 0))}</div>
                        </div>
                        <div>
                            <span class="tag">${t.temple_category || '寺庙'}</span>
                            ${t.type ? `<span class="tag">${t.type}</span>` : ''}
                        </div>
                        <div class="match-reason">${t.match_reason || t.reason || '暂无'}</div>
                    </div>
                `).join('');
            }
        }
        
        function retake() {
            document.getElementById('result-section').style.display = 'none';
            document.getElementById('input-section').style.display = 'block';
        }
    </script>
</body>
</html>
